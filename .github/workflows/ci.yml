name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Tests + self-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v
      - run: PYTHONPATH=plugins/factory python3 -m skillcheck . --strict --format github
  runtime:
    name: Runtime (Temporal core)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install ./runtime mypy==2.4.1
      - working-directory: runtime
        run: python3 -m mypy factory_runtime --strict
      # Test the installed package, not the source tree: copy the tests out so `factory_runtime` can only come
      # from site-packages (a packaging slip then fails here, not in a product).
      - name: Tests against the installed package
        run: |
          cp -R runtime/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python3 -c "import factory_runtime, pathlib; p = pathlib.Path(factory_runtime.__file__).parent; assert 'site-packages' in str(p), p; assert (p / 'py.typed').exists()"
          python3 -m unittest discover -s tests -t . -v
