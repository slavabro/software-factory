name: software-factory
description: skillcheck, or any factory command (e.g. the task system), at the version this action is pinned to
inputs:
  path:
    description: Repo root
    default: "."
  args:
    description: Extra skillcheck arguments (e.g. --strict), when run is skillcheck
    default: "--strict"
  run:
    description: >-
      "skillcheck" (default) lints the repo's skills; "setup" puts `factory` and `skillcheck` on PATH and exports
      FACTORY_DIR (this copy) for later steps; anything else is a factory command line, e.g. "task check".
    default: "skillcheck"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/plugins/factory
        RUN: ${{ inputs.run }}
        REPO: ${{ inputs.path }}
        ARGS: ${{ inputs.args }}
        DIR: ${{ github.action_path }}
      run: |
        case "$RUN" in
          skillcheck) python3 -m skillcheck "$REPO" --format github $ARGS ;;
          setup) echo "$DIR/home/bin" >> "$GITHUB_PATH"; echo "FACTORY_DIR=$DIR" >> "$GITHUB_ENV" ;;
          *) python3 -m sfactory --repo "$REPO" $RUN ;;
        esac
