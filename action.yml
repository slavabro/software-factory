name: skillcheck
description: Lint Claude Code skills, commands, subagents and CLAUDE.md files (software-factory)
inputs:
  path:
    description: Repo root to check
    default: "."
  args:
    description: Extra skillcheck arguments (e.g. --strict)
    default: "--strict"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/plugins/factory
      run: python3 -m skillcheck "${{ inputs.path }}" --format github ${{ inputs.args }}
