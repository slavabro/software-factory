[project]
name = "factory-runtime"
dynamic = ["version"]
description = "Shared runtime for products the software factory builds: the Temporal core and the process engine"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.35,<2",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory_runtime*"]

[tool.setuptools.dynamic]
version = { attr = "factory_runtime.__version__" }

[tool.setuptools.package-data]
factory_runtime = ["py.typed"]
