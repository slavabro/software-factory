scope: generic  # generic: built-in step types only; decision: uses FamilyOffice's decision step
description: >
  A definition with every kind of mistake fails the run before any step runs, with one non-retryable
  ProcessDefinitionError naming each problem and its step (the same checks validate_process runs when a file
  loads). Under Parallel, reading another step's result is one more problem.
interpreters: [LinearProcessWorkflow, ConditionalProcessWorkflow, ParallelProcessWorkflow]
input: {}
metadata: {}
outcome: failed
process:
  steps:
    - id: first
      type: activity
      activity: golden_value_activity
      args: [first]
    - id: mystery
      type: mystery_step_type
    - id: two_args
      type: activity
      activity: golden_echo_activity
      args: [one, two]
    - id: old_kwargs
      type: activity
      activity: golden_echo_activity
      kwargs: {summary: old}
    - id: bad_option
      type: activity
      activity: golden_echo_activity
      options: {not_an_option: 1}
    - id: no_activity
      type: activity
      on_error: continue
    - id: old_signal_name
      type: pause
      signal_name: resume_custom
    - id: bad_policy
      type: workflow
      workflow_name: GoldenChildWorkflow
      parent_close_policy: obliterate
    - id: pause_in_loop
      type: for_each
      items: [1]
      step: {type: pause}
    - id: inner_on_error
      type: for_each
      items: [1]
      step: {type: activity, activity: golden_value_activity, on_error: continue}
    - id: bad_syntax
      type: activity
      activity: golden_value_activity
      condition: "{{results.first}} ~~ 1"
    - id: unsafe_call
      type: activity
      activity: golden_value_activity
      condition: "__import__('os') == None"
    - id: refs
      type: activity
      activity: golden_echo_activity
      args:
        - later: "{{results.never_ran}}"
          earlier: "{{results.first}}"
          item: "{{item.name}}"
          unknown: "{{env.HOME}}"
    - id: first
      type: activity
      activity: golden_value_activity
      on_error: retry
