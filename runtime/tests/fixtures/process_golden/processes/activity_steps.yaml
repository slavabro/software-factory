scope: generic  # generic: built-in step types only; decision: uses FamilyOffice's decision step
description: >
  Activity steps and their options: defaults (60 s, 3 attempts), timeout, heartbeat, every retry key, args resolved
  from input and results (a missing path -> None, placeholders inside text filled in, a non-string value as text),
  `options:` passed to execute_activity (summary, activity_id, schedule_to_close_timeout in seconds), a dict `args`
  passed whole, a single value as `args`, an empty `args`, retries exhausted and a non-retryable error under
  on_error continue.
interpreters: [LinearProcessWorkflow, ConditionalProcessWorkflow]
input:
  label: alpha
  nested: {deep: {value: 42}}
  list: [1, 2, 3]
metadata: {source: golden}
process:
  metadata: {name: golden_activity_steps}
  steps:
    - id: plain
      type: activity
      activity: golden_echo_activity
    - id: with_options
      type: activity
      activity: golden_echo_activity
      args: ["{{input.label}}"]
      timeout: 15
      heartbeat_timeout_seconds: 5
      retry:
        max_attempts: 5
        initial_interval_seconds: 2
        non_retryable_error_types: [GoldenFatalError, GoldenOtherError]
    - id: templates
      type: activity
      activity: golden_echo_activity
      description: every kind of placeholder in one argument
      args:
        - from_results: "{{results.with_options.args}}"
          whole_result: "{{results.plain}}"
          from_input: "{{input.nested.deep.value}}"
          spaced: "{{ input.label }}"
          input_list: ["{{input.list}}", literal]
          missing_field: "{{results.with_options.no_such_field}}"
          missing_input: "{{input.absent.path}}"
          inline_text: "prefix {{input.label}} suffix"
          inline_number: "value {{input.nested.deep.value}} of {{input.list}}"
          inline_missing: "missing: {{input.absent}}"
          two_in_one: "{{input.label}}-{{input.label}}"
          number: 7
          flag: true
          nothing: null
    - id: options_passed
      type: activity
      activity: golden_echo_activity
      args: ["{{input.label}}"]
      options:
        summary: "Echo {{input.label}}"
        activity_id: golden-fixed-activity-id
        schedule_to_close_timeout: 120
    - id: args_dict_whole
      type: activity
      activity: golden_echo_activity
      args: {only_key: kept_value, label: "{{input.label}}"}
    - id: args_single_value
      type: activity
      activity: golden_echo_activity
      args: "{{input.nested}}"
    - id: args_empty
      type: activity
      activity: golden_echo_activity
      args: []
    - id: retries_exhausted
      type: activity
      activity: golden_fail_activity
      retry: {max_attempts: 2, initial_interval_seconds: 1}
      on_error: continue
    - id: non_retryable
      type: activity
      activity: golden_fail_activity
      retry: {max_attempts: 4, non_retryable_error_types: [GoldenFatalError]}
      on_error: continue
    - id: after_all
      type: activity
      activity: golden_value_activity
      args: ["{{results.retries_exhausted}}"]
